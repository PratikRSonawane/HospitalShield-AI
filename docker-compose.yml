services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports: ["8000:8000"]
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - APP_ENV=development
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 3s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    ports: ["5173:5173"]
    depends_on:
      - api
