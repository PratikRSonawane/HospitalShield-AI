services:
  - type: web
    name: hospitalshield-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerTarget: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: development
      - key: CORS_ALLOWED_ORIGINS
        value: "*" # Note: In a real production setup, set this to the Vercel URL
